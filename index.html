<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PK Server Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Da+2:wght@600;800&family=Tiro+Bangla&display=swap">
<style>
:root{
  --night:#0f1830;--panel:#fff8e7;--ink:#17254a;--pop:#ffc933;--good:#2fd07a;--bad:#ff4057;
  --f-display:'Baloo 2','Baloo Da 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Baloo 2','Baloo Da 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#1d2f63 0%,#0f1830 60%,#080d1e 100%);color:#fff;font-family:var(--f-body);font-weight:600;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;position:relative;padding-block:10px}
#top{text-align:center;display:flex;flex-direction:column;gap:2px}
#top h1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5.4vw,26px);line-height:1.05;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#top p{margin:0;font-size:13px;opacity:.7}
#hud{display:flex;align-items:center;justify-content:center;min-height:22px}
#hud .hearts{font-size:20px;letter-spacing:3px;color:var(--bad);line-height:1;filter:drop-shadow(0 0 6px rgba(255,64,87,.7))}
#hud .hearts i{font-style:normal;display:inline-block;animation:hb 1.4s ease-in-out infinite}
#hud .hearts i.off{opacity:.25;animation:none;filter:none}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#tbar{height:8px;border-radius:6px;background:#1f2d57;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#tfill{height:100%;width:100%;background:var(--good);box-shadow:0 0 10px currentColor}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:16px;touch-action:none;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.07)}
#foot{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;opacity:.9;padding-top:2px}
#foot b{font-family:var(--f-display);font-weight:800;font-size:16px}
.logo{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#fff;display:block;flex:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,30,.72);z-index:5;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov[hidden]{display:none!important}
.card{background:linear-gradient(#fffaf0,#f6ecd0);color:var(--ink);border-radius:22px;padding:22px 20px;width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.45);animation:cardin .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.card h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;margin:0}
.card p{margin:0;font-size:15px;line-height:1.35}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-family:var(--f-display);font-weight:800;font-size:20px;background:linear-gradient(#52e698,#1fbd66);color:#052b16;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.45)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.btn.big{width:100%;font-size:30px;padding:16px}
.btn.alt{background:#dfd6bd;color:var(--ink)}

/* ===== hint scroll (old letter paper) ===== */
#tip{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(6,10,24,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0}
#tip[hidden]{display:none!important}
#tip.on{animation:tfade .3s ease-out forwards}
#tip.closing{animation:tfadeout .36s ease-in forwards}
.scroll{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;transform-origin:92% 0;filter:drop-shadow(0 16px 20px rgba(0,0,0,.6))}
#tip.on .scroll{animation:flyin .75s cubic-bezier(.2,1.15,.3,1) both}
#tip.closing .scroll{animation:flyout .36s ease-in both}
.rod{display:block;height:18px;border-radius:9px;margin:0 -6px;background:linear-gradient(#b27c40,#6e4219 55%,#4a2a0e);box-shadow:inset 0 2px 2px rgba(255,225,170,.55);position:relative;z-index:2}
.rod::before,.rod::after{content:"";position:absolute;top:-3px;width:14px;height:24px;border-radius:7px;background:linear-gradient(#e2ac62,#7c4a1a)}
.rod::before{left:-9px}.rod::after{right:-9px}
.sheet{position:relative;overflow:hidden;max-height:0;margin:0 6px;padding:0 22px;color:#4a2c12;font-family:'Tiro Bangla','Baloo Da 2',serif;
  background:radial-gradient(ellipse at 22% 12%,rgba(255,255,255,.5),transparent 55%),radial-gradient(ellipse at 85% 92%,rgba(120,70,20,.32),transparent 50%),radial-gradient(circle at 70% 30%,rgba(150,100,40,.12),transparent 35%),linear-gradient(#f6e7bd,#e9d19b);
  box-shadow:inset 0 0 38px rgba(110,70,20,.5),inset 0 0 6px rgba(90,50,10,.7)}
#tip.on .sheet{animation:unfurl .95s .3s cubic-bezier(.22,.9,.25,1) forwards}
.sheet h3{font-family:'Baloo 2',serif;font-weight:800;font-size:19px;line-height:1.15;margin:0 0 4px;color:#6b3a12;display:flex;align-items:center;gap:8px;border-bottom:2px dashed rgba(107,58,18,.4);padding-bottom:6px}
.sheet h3 em{font-style:normal;font-size:22px;filter:drop-shadow(0 0 5px rgba(255,200,40,.9))}
.sheet ol{margin:10px 0 0;padding-left:24px}
.sheet li{font-size:15.5px;line-height:1.6;margin-bottom:7px;opacity:0;transform:translateY(8px);filter:blur(2px)}
#tip.on .sheet li{animation:ink .7s ease-out forwards}
.sheet li::marker{color:#9a4a12;font-weight:700}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ft button{font-family:'Baloo 2',serif;font-weight:800;font-size:17px;border:0;border-radius:10px;padding:8px 18px;color:#fff3d6;cursor:pointer;background:linear-gradient(#a8672a,#6b3a12);box-shadow:0 3px 0 rgba(60,30,5,.5),inset 0 1px 0 rgba(255,220,160,.5)}
.ft button:active{transform:translateY(2px)}
.seal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2',serif;font-weight:800;font-size:15px;color:#ffd9d9;background:radial-gradient(circle at 35% 30%,#ff7a7a,#c0202a 55%,#7a0d14);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 -3px 4px rgba(0,0,0,.35);transform:rotate(-12deg)}
@keyframes tfade{to{opacity:1}}
@keyframes tfadeout{from{opacity:1}to{opacity:0}}
@keyframes flyin{from{opacity:0;transform:translate(70px,-150px) scale(.12) rotate(22deg)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes flyout{to{opacity:0;transform:translate(70px,-150px) scale(.12) rotate(22deg)}}
@keyframes unfurl{from{max-height:0;padding-top:0;padding-bottom:0}to{max-height:min(470px,66vh);padding-top:16px;padding-bottom:16px}}
@keyframes ink{to{opacity:1;transform:none;filter:none}}

/* verified screen (shown when the admin presses Stop) */
#done{position:absolute;inset:0;z-index:20;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;overflow:hidden}
#done[hidden]{display:none!important}
#done .okwrap{position:relative;width:132px;height:132px;display:grid;place-items:center}
#done .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--good);opacity:0}
#done .disc{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7bf0b0,#2fd07a 55%,#169a55);display:grid;place-items:center;transform:scale(0);box-shadow:0 0 30px rgba(47,208,122,.6)}
#done svg.tick{width:60px;height:60px}
#done svg.tick path{fill:none;stroke:#072b17;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
#done h2{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7.5vw,34px);line-height:1.05;margin:0;opacity:0;transform:translateY(14px)}
#done .conn{display:flex;align-items:center;gap:10px;background:#1d2d57;border-radius:16px;padding:10px 16px;opacity:0;transform:translateY(14px)}
#done .conn .logo{width:36px;height:36px}
#done .conn span{font-family:var(--f-display);font-weight:800;font-size:19px}
#done .dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(47,208,122,.7)}
#done .bar{width:min(260px,70vw);height:8px;border-radius:6px;background:#2a3b6b;overflow:hidden;opacity:0}
#done .bar i{display:block;height:100%;width:0;background:var(--good);border-radius:6px}
#done .conf{position:absolute;left:50%;top:38%;width:9px;height:9px;border-radius:2px;opacity:0}
#done.on .disc{animation:pop .55s cubic-bezier(.2,1.4,.4,1) .1s forwards}
#done.on svg.tick path{animation:draw .5s ease-out .55s forwards}
#done.on .ring{animation:ripple 1.8s ease-out .5s infinite}
#done.on .ring.r2{animation-delay:1.1s}
#done.on h2{animation:rise .6s ease-out .9s forwards}
#done.on .conn{animation:rise .6s ease-out 1.2s forwards}
#done.on .dot{animation:pulse 1.6s ease-out 1.8s infinite}
#done.on .bar{animation:fadein .4s ease-out 1.5s forwards}
#done.on .bar i{animation:fill 1.6s ease-in-out 1.6s forwards}
#done.on .conf{animation:conf 1.6s ease-out 0.7s forwards;background:var(--c)}
@keyframes pop{to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes fill{to{width:100%}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,208,122,.7)}100%{box-shadow:0 0 0 12px rgba(47,208,122,0)}}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#done *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><h1>Confirm you are not a robot</h1><p>Play the game below to continue</p></div>
  <div id="hud"><div class="hearts" id="hHearts" aria-label="Lives"></div></div>
  <div id="tbar"><div id="tfill"></div></div>
  <div id="wrap">
    <canvas id="cv" aria-label="Game board"></canvas>
    <div class="ov" id="ov" hidden><div class="card" id="card"></div></div>
    <div id="tip" hidden>
      <div class="scroll">
        <i class="rod"></i>
        <div class="sheet">
          <h3><em>💡</em><span id="tipT">Hint</span></h3>
          <ol id="tipB"></ol>
          <div class="ft"><button id="tipX" type="button">Got it</button><span class="seal">PK</span></div>
        </div>
        <i class="rod"></i>
      </div>
    </div>
  </div>
  <div id="foot"><span>Powered by</span><img class="logo" alt="PK Server logo"><b>PK Server</b></div>

  <section id="done" hidden aria-live="polite">
    <div class="okwrap"><span class="ring"></span><span class="ring r2"></span><div class="disc"><svg class="tick" viewBox="0 0 60 60"><path d="M13 31 L26 44 L48 18"/></svg></div></div>
    <h2>You are confirmed:<br>not a robot</h2>
    <div class="conn"><img class="logo" alt="PK Server logo"><span>PK Server is connected</span><i class="dot"></i></div>
    <div class="bar"><i></i></div>
  </section>
</div>

<script>
(function(){
'use strict';
var W=360,H=560;
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),wrap=$('wrap');
var FONT="'Baloo 2','Baloo Da 2','Trebuchet MS',sans-serif";
var rnd=function(a,b){return a+Math.random()*(b-a)};
var ri=function(a,b){return Math.floor(rnd(a,b+1))};
var pick=function(a){return a[ri(0,a.length-1)]};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i);var t=a[i];a[i]=a[j];a[j]=t}return a}
try{if(document.fonts&&document.fonts.load){document.fonts.load("800 20px 'Baloo 2'");document.fonts.load("800 20px 'Baloo Da 2'","আ")}}catch(e){}

/* ---------- sound ---------- */
var ac=null,muted=false;
function beep(f,d,type,v,slide){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+(d||.12));
    g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.12));
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(d||.12));
  }catch(e){}
}
var sfx={
  ok:function(){beep(660,.1,'triangle',.08);setTimeout(function(){beep(990,.14,'triangle',.08)},80)},
  bad:function(){beep(220,.25,'sawtooth',.06,90)},
  tap:function(){beep(520,.05,'square',.03)},
  cut:function(){beep(900,.08,'sawtooth',.04,300)},
  thud:function(){beep(140,.12,'sine',.1,60)},
  boom:function(){beep(120,.5,'sawtooth',.1,30)},
  win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.16,'triangle',.08)},i*90)})},
  go:function(){beep(300,.4,'sine',.06,500)},
  page:function(){beep(700,.12,'triangle',.04,300)}
};

/* ---------- canvas sizing + drawing helpers ---------- */
var K=1;
function fit(){
  var b=wrap.getBoundingClientRect();
  var s=Math.min(b.width/W,b.height/H);
  if(!(s>0))return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  K=s*dpr;cv.width=Math.round(W*K);cv.height=Math.round(H*K);
}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function txt(s,x,y,size,col,align,stroke){
  s=String(s);
  if(align&&align!=='left'&&align!=='right'&&align!=='center'){stroke=align;align='center'}
  ctx.font='800 '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function shade(c,a){
  if(typeof c!=='string'||c.charAt(0)!=='#'||c.length!==7)return c;
  var n=parseInt(c.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(v){return Math.round(a>0?v+(255-v)*a:v*(1+a))}
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function shadowE(x,y,w,h,a){ctx.fillStyle='rgba(0,0,0,'+(a||.22)+')';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill()}
function ball(x,y,r,col,glow){
  ctx.save();
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow}else{ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=6;ctx.shadowOffsetY=3}
  var g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  g.addColorStop(0,shade(col,.6));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.5));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(x-r*.3,y-r*.45,r*.32,r*.17,-.5,0,7);ctx.fill();
  ctx.restore();
}
function gloss(x,y,w,h,r,col){
  ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;
  var g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,shade(col,.38));g.addColorStop(.5,col);g.addColorStop(1,shade(col,-.32));
  ctx.fillStyle=g;rr(x,y,w,h,r);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(15,25,60,.9)';ctx.lineWidth=2.5;rr(x,y,w,h,r);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.24)';rr(x+3,y+3,w-6,h*.42,Math.max(3,r-3));ctx.fill();
}
function cloud(x,y,s,a){
  ctx.fillStyle='rgba(255,255,255,'+(a||.85)+')';ctx.beginPath();ctx.arc(x,y,12*s,0,7);ctx.arc(x+14*s,y-6*s,15*s,0,7);ctx.arc(x+30*s,y,12*s,0,7);ctx.arc(x+16*s,y+4*s,12*s,0,7);ctx.fill();
}
var BK=[];for(var bi=0;bi<16;bi++)BK.push({x:rnd(0,W),y:rnd(0,H),r:rnd(8,34),s:rnd(5,16),p:rnd(0,6)});
function bokeh(t,a){
  ctx.save();
  for(var i=0;i<BK.length;i++){
    var b=BK[i],y=(((b.y-t*b.s)%(H+80))+H+80)%(H+80)-40,al=a*(.55+.45*Math.sin(t*1.2+b.p));
    ctx.fillStyle='rgba(255,255,255,'+al+')';ctx.beginPath();ctx.arc(b.x+Math.sin(t*.5+b.p)*10,y,b.r,0,7);ctx.fill();
  }
  ctx.restore();
}
var fx=[];
function burst(x,y,n,col,spd){for(var i=0;i<n;i++){var a=rnd(0,6.28),v=rnd(30,spd||160);fx.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:rnd(.4,.9),m:.9,c:col,r:rnd(2,5)})}}
function fxStep(dt){for(var i=fx.length-1;i>=0;i--){var p=fx[i];p.l-=dt;if(p.l<=0){fx.splice(i,1);continue}p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}}
function fxDraw(){for(var i=0;i<fx.length;i++){var p=fx[i];ctx.globalAlpha=clamp(p.l/p.m,0,1);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowColor='transparent'}

var SKIES=[['#4aa3f0','#dff1ff'],['#f0864a','#ffe6bd'],['#6a5ed6','#d3c7ff'],['#2fb596','#d3fff0']];
var WALLS=['#efe6d6','#d6ebef','#f1dae2','#e4eed3'];
var COLS=['#ff4057','#ffc933','#2f9bff','#2fd07a','#a35bff','#ff8a2b'];

/* light bulb icon (hint button) */
function drawBulb(x,y,t){
  var p=.5+.5*Math.sin(t*3);
  ctx.save();
  var gl=ctx.createRadialGradient(x,y,2,x,y,26);gl.addColorStop(0,'rgba(255,222,90,'+(.5+.3*p)+')');gl.addColorStop(1,'rgba(255,222,90,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();
  var g=ctx.createRadialGradient(x-3,y-6,1,x,y-3,12);g.addColorStop(0,'#fffbe0');g.addColorStop(.5,'#ffd84a');g.addColorStop(1,'#e8a60c');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-3,10,0,7);ctx.fill();
  ctx.fillStyle='#e8a60c';ctx.beginPath();ctx.moveTo(x-5,y+4);ctx.lineTo(x+5,y+4);ctx.lineTo(x+4,y+8);ctx.lineTo(x-4,y+8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#9aa3b5';rr(x-5,y+7,10,3,1.5);ctx.fill();rr(x-3.5,y+10.5,7,3,1.5);ctx.fill();
  ctx.strokeStyle='#b8741a';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x-3,y+5);ctx.lineTo(x-2,y-3);ctx.lineTo(x,y-1);ctx.lineTo(x+2,y-3);ctx.lineTo(x+3,y+5);ctx.stroke();
  ctx.restore();
}
function topBar(g){

function solveRiver(np,nr,cap){
  function ok(a,b){var rp=np-a,rq=nr-b;return(a===0||a>=b)&&(rp===0||rp>=rq)}

  var seen={},q=[[np,nr,0,0]];seen[np+','+nr+',0']=1;
  while(q.length){
    var s=q.shift(),a=s[0],b=s[1],side=s[2],d=s[3];
    if(a===0&&b===0&&side===1)return d;
    var pa=side===0?a:np-a,pb=side===0?b:nr-b;
    for(var dp=1;dp<=Math.min(cap,pa);dp++)for(var dr=0;dr<=Math.min(cap-dp,pb);dr++){
      var na=side===0?a-dp:a+dp,nb=side===0?b-dr:b+dr;
      if(!ok(na,nb))continue;
      var k=na+','+nb+','+(1-side);if(seen[k])continue;seen[k]=1;q.push([na,nb,1-side,d+1]);
    }
  }
  return-1;
}

/* 9. Maze */
function MazeGame(d){
  var m=Math.min(12,5+Math.floor(d/2)),g=baseG('maze','REACH THE FLAG',16+m*2.5),cs=320/m,ox=20,oy=110,wl=[],seen=[],i;
  for(i=0;i<m*m;i++){wl.push([1,1,1,1]);seen.push(false)}
  var st=[0];seen[0]=true;
  while(st.length){
    var c=st[st.length-1],cx=c%m,cy=Math.floor(c/m),nb=[];
    if(cy>0&&!seen[c-m])nb.push([c-m,0,2]);
    if(cx<m-1&&!seen[c+1])nb.push([c+1,1,3]);
    if(cy<m-1&&!seen[c+m])nb.push([c+m,2,0]);
    if(cx>0&&!seen[c-1])nb.push([c-1,3,1]);
    if(!nb.length){st.pop();continue}
    var q=pick(nb);wl[c][q[1]]=0;wl[q[0]][q[2]]=0;seen[q[0]]=true;st.push(q[0]);
  }
  var pos=0,drag=false,goal=m*m-1;
  function cellAt(p){var cx=Math.floor((p.x-ox)/cs),cy=Math.floor((p.y-oy)/cs);if(cx<0||cy<0||cx>=m||cy>=m)return-1;return cy*m+cx}
  function nbr(c){var o=[];if(!wl[c][0])o.push(c-m);if(!wl[c][1])o.push(c+1);if(!wl[c][2])o.push(c+m);if(!wl[c][3])o.push(c-1);return o}
  function dist(a,b){return Math.abs(a%m-b%m)+Math.abs(Math.floor(a/m)-Math.floor(b/m))}
  g.down=function(p){var c=cellAt(p);if(c>=0&&dist(c,pos)<=1)drag=true;g.move(p)};
  g.move=function(p){
    if(!drag||g.status!=='play')return;
    var t=cellAt(p);if(t<0)return;
    for(var k=0;k<4&&t!==pos;k++){
      var best=-1,bd=dist(pos,t);
      nbr(pos).forEach(function(n){var dd=dist(n,t);if(dd<bd){bd=dd;best=n}});
      if(best<0)break;pos=best;sfx.tap();
    }
    if(pos===goal)g.status='win';
  };
  g.up=function(){drag=false};
  var vx=0,vy=0;
  g.step=function(dt){var tx=ox+(pos%m)*cs+cs/2,ty=oy+Math.floor(pos/m)*cs+cs/2;if(!vx){vx=tx;vy=ty}vx+=(tx-vx)*Math.min(1,dt*16);vy+=(ty-vy)*Math.min(1,dt*16)};
  g.draw=function(){
    head(g,'#f3ead6');
    ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;
    var fg=ctx.createLinearGradient(0,oy,0,oy+cs*m);fg.addColorStop(0,'#fffdf5');fg.addColorStop(1,'#efe3c4');ctx.fillStyle=fg;rr(ox-4,oy-4,cs*m+8,cs*m+8,8);ctx.fill();ctx.restore();
    ctx.lineCap='round';
    [['rgba(0,0,0,.2)',5,2],['#3a2a18',3.5,0]].forEach(function(sty){
      ctx.strokeStyle=sty[0];ctx.lineWidth=sty[1];ctx.beginPath();
      for(var c=0;c<m*m;c++){
        var x=ox+(c%m)*cs+sty[2],y=oy+Math.floor(c/m)*cs+sty[2];
        if(wl[c][0]){ctx.moveTo(x,y);ctx.lineTo(x+cs,y)}
        if(wl[c][3]){ctx.moveTo(x,y);ctx.lineTo(x,y+cs)}
        if(c%m===m-1&&wl[c][1]){ctx.moveTo(x+cs,y);ctx.lineTo(x+cs,y+cs)}
        if(c>=m*(m-1)&&wl[c][2]){ctx.moveTo(x,y+cs);ctx.lineTo(x+cs,y+cs)}
      }
      ctx.stroke();
    });
    var gx=ox+(goal%m)*cs+cs*.3,gy=oy+Math.floor(goal/m)*cs+cs*.18,fw=cs*.45,fh=cs*.32;
    ctx.fillStyle='#ff4057';ctx.beginPath();ctx.moveTo(gx,gy);
    for(var s=0;s<=6;s++)ctx.lineTo(gx+fw*s/6,gy+Math.sin(g.t*6+s)*2.2);
    for(var s2=6;s2>=0;s2--)ctx.lineTo(gx+fw*s2/6,gy+fh+Math.sin(g.t*6+s2)*2.2);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a2a18';ctx.fillRect(gx-1.5,gy-2,3,cs*.7);
    var pr=cs*.3+Math.sin(g.t*5)*1;
    ball(vx||(ox+cs/2),vy||(oy+cs/2),pr,'#2fd07a',16);
    instr('সবুজ বিন্দু টেনে লাল পতাকায় নিয়ে যাও');
  };
  return g;
}

      ctx.save();if(v>.5){ctx.shadowColor='#ffd23f';ctx.shadowBlur=24}
      ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y-2,r,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle=v>.5?'#9aa3b5':'#5a6288';rr(x-r*.45,y+r*.7,r*.9,r*.5,3);ctx.fill();

      if(idle>8&&need[i]){var pr=.5+.5*Math.sin(g.t*5);ctx.strokeStyle='rgba(120,255,170,'+(.4+.5*pr)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-2,r+5+pr*3,0,7);ctx.stroke()}

/* 16. Slide puzzle */
function SlideGame(d){
  var n=d>=10?4:3,k=Math.min(40,10+d*2),g=baseG('slide','SLIDE THE TILES',n===3?60+k*1.5:100+k*2),t=[],i;
  for(i=0;i<n*n;i++)t.push(i+1);t[n*n-1]=0;
  var bl=n*n-1,last=-1;
  function solved(){return t.every(function(v,i){return i===n*n-1?v===0:v===i+1})}
  function mv(){
    var nb=[];
    if(bl-n>=0)nb.push(bl-n);if(bl+n<n*n)nb.push(bl+n);if(bl%n>0)nb.push(bl-1);if(bl%n<n-1)nb.push(bl+1);
    var f=nb.filter(function(c){return c!==last});var c=pick(f.length?f:nb);
    t[bl]=t[c];t[c]=0;last=bl;bl=c;
  }
  for(i=0;i<k;i++)mv();
  while(solved())mv();
  var cs=Math.floor(320/n),ox=(W-cs*n)/2,oy=120,disp={};
  g.step=function(dt){for(var i=0;i<n*n;i++){var v=t[i];if(!v)continue;var tx=ox+(i%n)*cs,ty=oy+Math.floor(i/n)*cs;if(!disp[v])disp[v]={x:tx,y:ty};disp[v].x+=(tx-disp[v].x)*Math.min(1,dt*16);disp[v].y+=(ty-disp[v].y)*Math.min(1,dt*16)}};
  g.down=function(p){
    var cx=Math.floor((p.x-ox)/cs),cy=Math.floor((p.y-oy)/cs);
    if(cx<0||cy<0||cx>=n||cy>=n)return;
    var c=cy*n+cx,bx2=bl%n,by2=Math.floor(bl/n);
    if(Math.abs(cx-bx2)+Math.abs(cy-by2)!==1)return;
    t[bl]=t[c];t[c]=0;bl=c;sfx.tap();if(solved())g.status='win';
  };
  g.draw=function(){
    g.cnt=t.filter(function(v,i){return v===i+1}).length+' / '+(n*n-1);head(g,'#e6f0ff');
    ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;ctx.fillStyle='#1b2a5a';rr(ox-6,oy-6,cs*n+12,cs*n+12,16);ctx.fill();ctx.restore();
    for(var i=0;i<n*n;i++){ctx.fillStyle='rgba(0,0,0,.25)';rr(ox+(i%n)*cs+3,oy+Math.floor(i/n)*cs+3,cs-6,cs-6,12);ctx.fill()}
    for(var j=0;j<n*n;j++){
      var v=t[j];if(!v||!disp[v])continue;var ok=v===j+1;
      bt(disp[v].x+3,disp[v].y+3,cs-6,cs-6,ok?'#2fd07a':'#3b5bdb',v,n===3?40:32);
    }
    instr('টাইল সরিয়ে ১, ২, ৩... ক্রমে সাজাও');
  };
  return g;
}

/* 20. Darts on a spinning log */
function DartGame(d){
  var need=4+Math.min(5,Math.floor(d/3)),pre=Math.min(5,Math.floor(d/3)),g=baseG('darts','HIT THE LOG',0),rot=0,w0=1.6+d*.08,stuck=[],got=0,cx=180,cy=225,R=62,i;
  for(i=0;i<pre;i++)stuck.push(i*(Math.PI*2/pre));
  g.step=function(dt){rot+=w0*(1+(d>=6?.5*Math.sin(g.t*1.3):0))*dt};
  g.down=function(){
    if(got>=need)return;
    var rel=((Math.PI/2-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    for(var k=0;k<stuck.length;k++){
      var df=Math.abs((((rel-stuck[k])+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI);
      if(df<.24){g.status='lose';g.msg='Dart collision!';burst(cx,cy+R,20,'#ffe36b',220);sfx.boom();g.shake=.35;return}
    }
    stuck.push(rel);got++;sfx.thud();burst(cx,cy+R,8,'#c58b4a',110);
    if(got>=need)g.status='win';
  };
  function dart(a,len,col){
    var x1=cx+Math.cos(a)*R,y1=cy+Math.sin(a)*R,x2=cx+Math.cos(a)*(R+len),y2=cy+Math.sin(a)*(R+len);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1+2,y1+3);ctx.lineTo(x2+2,y2+3);ctx.stroke();
    ctx.strokeStyle='#17254a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.stroke();
    ball(x2,y2,6,'#ff4057');
  }
  g.draw=function(){
    g.cnt=got+' / '+need;head(g,'#dfe9f7');
    stuck.forEach(function(a){dart(a+rot,34,'#e8ecf6')});
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
    shadowE(0,R+8,R,10,.2);
    var lg=ctx.createRadialGradient(-18,-18,6,0,0,R);lg.addColorStop(0,'#dba868');lg.addColorStop(.6,'#b9814a');lg.addColorStop(1,'#7a4e22');
    ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.strokeStyle='#17254a';ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle='rgba(90,55,20,.7)';ctx.lineWidth=3;[R*.75,R*.5,R*.25].forEach(function(r){ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke()});
    ctx.strokeStyle='rgba(90,55,20,.35)';ctx.lineWidth=2;for(var q=0;q<8;q++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(q*.785)*R,Math.sin(q*.785)*R);ctx.stroke()}
    ctx.fillStyle='#17254a';ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(cx-18,cy-24,26,12,-.6,0,7);ctx.fill();
    txt('Darts left: '+(need-got),W/2,420,22,'#17254a');
    if(got<need){ctx.save();ctx.translate(W/2,500+Math.sin(g.t*4)*3);ctx.rotate(-Math.PI/2);ctx.strokeStyle='#17254a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();ctx.strokeStyle='#ffc933';ctx.lineWidth=3.5;ctx.stroke();ctx.restore()}
    instr('ছুঁড়তে ট্যাপ করো, অন্য ডার্টে লাগিও না');
  };
  return g;
}

/* =====================================================================
   FLOW: 20 puzzles in a fixed order, then loop again but harder
   ===================================================================== */
var MAKERS={plug:PlugGame,rope:RopeGame,river:RiverGame,odd:OddGame,pairs:PairsGame,simon:SimonGame,math:MathGame,nums:NumsGame,maze:MazeGame,lights:LightsGame,stroop:StroopGame,count:CountGame,whack:WhackGame,catch:CatchGame,sort:SortGame,slide:SlideGame,timing:TimingGame,pattern:PatternGame,dodge:DodgeGame,darts:DartGame};
var ORDER=['plug','rope','river','odd','pairs','simon','math','nums','maze','lights','stroop','count','whack','catch','sort','slide','timing','pattern','dodge','darts'];
var S={idx:0,round:0,lives:3,state:'idle',wait:0,stopped:false,gain:0,tip:false};
var cur=null;
function diff(){return 7+S.round*8+Math.floor(S.idx*.5)}

/* logo */
var LOGO_URL='https://i.postimg.cc/5NsY4R8Q/pk-initial-circle-logo-template-vector.jpg';
var LOGO_FALLBACK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff" stroke="#17254a" stroke-width="4"/><text x="32" y="41" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="26" fill="#17254a">PK</text></svg>');
Array.prototype.forEach.call(document.querySelectorAll('img.logo'),function(im){
  im.onerror=function(){im.onerror=null;im.src=LOGO_FALLBACK};im.src=LOGO_URL;
});

function hud(){var h='';for(var i=0;i<3;i++)h+='<i class="'+(i<S.lives?'':'off')+'">♥</i>';$('hHearts').innerHTML=h}
function showOv(html,btns){
  var card=$('card');card.innerHTML=html;
  var row=document.createElement('div');row.className='btns';
  btns.forEach(function(b){var e=document.createElement('button');e.className='btn '+(b.cls||'');e.textContent=b.label;e.onclick=b.fn;row.appendChild(e)});
  card.appendChild(row);$('ov').hidden=false;
  var f=card.querySelector('button');if(f)f.focus({preventScroll:true});
}
function hideOv(){$('ov').hidden=true}

/* hint scroll */
var tipBusy=false;
function openTip(){
  if(S.tip||tipBusy||S.state!=='play'||!cur)return;
  S.tip=true;
  var list=TIPS[cur.type]||[];
  $('tipT').textContent='How to solve: '+cur.title;
  var ol=$('tipB');ol.innerHTML='';
  list.forEach(function(s,i){var li=document.createElement('li');li.textContent=s;li.style.animationDelay=(1+i*.4)+'s';ol.appendChild(li)});
  var el=$('tip');el.hidden=false;el.classList.remove('closing');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  sfx.page();
  try{$('tipX').focus({preventScroll:true})}catch(e){}
}
function closeTip(){
  if(!S.tip||tipBusy)return;tipBusy=true;
  var el=$('tip');el.classList.add('closing');sfx.page();
  setTimeout(function(){el.hidden=true;el.classList.remove('on');el.classList.remove('closing');S.tip=false;tipBusy=false},370);
}
$('tipX').onclick=closeTip;
$('tip').addEventListener('pointerdown',function(e){if(e.target===$('tip'))closeTip()});

function startLevel(){
  S.tip=false;tipBusy=false;$('tip').hidden=true;
  cur=MAKERS[ORDER[S.idx]](diff());S.state='play';fx.length=0;hideOv();hud();
  $('tbar').style.visibility=cur.timeMax?'visible':'hidden';beat();
}
function begin(){S.idx=0;S.round=0;S.lives=3;startLevel()}
function startScreen(){S.state='idle';showOv('',[{label:'Start',cls:'big',fn:begin}]);beat()}
function onWin(){
  S.state='won';S.wait=1.1;S.gain=100;sfx.win();
  for(var i=0;i<5;i++)burst(rnd(60,300),rnd(180,380),14,COLS[i%6],240);
}
function onLose(){S.state='lost';S.wait=cur.type==='rope'||cur.type==='whack'||cur.type==='catch'||cur.type==='dodge'||cur.type==='darts'?1:.7;S.lives--;hud();if(cur.type==='plug'||cur.type==='river')sfx.bad()}
function afterLose(){
  S.state='over';beat();
  if(S.lives>0)showOv('<h2>'+cur.msg+'</h2><p>'+S.lives+(S.lives===1?' life':' lives')+' left</p>',[{label:'Try again',cls:'big',fn:startLevel}]);
  else showOv('<h2>Game over</h2><p>Start again from the beginning</p>',[{label:'Play again',cls:'big',fn:begin}]);
}

/* input */
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}
  if(S.state!=='play'||!cur||S.stopped||S.tip)return;
  var p=pos(e);
  if(Math.hypot(p.x-(W-26),p.y-26)<26){openTip();return}
  cur.down(p);
});
cv.addEventListener('pointermove',function(e){if(S.state==='play'&&cur&&!S.stopped&&!S.tip)cur.move(pos(e))});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){if(cur)cur.up()})});

/* remote control + presence (the module script at the bottom plugs Firestore in) */
var pid='';
try{pid=localStorage.getItem('pk-pid')||''}catch(e){}
if(!pid){pid='P'+Math.random().toString(16).slice(2,8).toUpperCase();try{localStorage.setItem('pk-pid',pid)}catch(e){}}
var PK=window.PK={
  pid:pid,beatHook:null,
  setStopped:function(v){
    v=!!v;if(v===S.stopped)return;S.stopped=v;var el=$('done');
    if(v){el.hidden=false;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');if(!el.querySelector('.conf'))confetti(el)}
    else{el.hidden=true;el.classList.remove('on')}
    beat();
  },
  info:function(){return{screen:S.stopped?'verified':S.state==='idle'?'start':S.state==='over'?'gameover':'playing',puzzleNo:S.idx+1,puzzle:ORDER[S.idx],round:S.round+1,lives:S.lives,mobile:/Mobi|Android/i.test(navigator.userAgent)}}
};
function beat(){if(PK.beatHook)try{PK.beatHook(PK.info())}catch(e){}}
setInterval(beat,8000);
function confetti(el){
  var cs=['#2fd07a','#ffc933','#2f9bff','#ff4057','#a35bff'];
  for(var i=0;i<22;i++){var s=document.createElement('span');s.className='conf';var a=rnd(0,6.28),r=rnd(90,190);
    s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',(Math.sin(a)*r-20)+'px');s.style.setProperty('--r',ri(-360,360)+'deg');s.style.setProperty('--c',pick(cs));s.style.animationDelay=(.7+rnd(0,.5))+'s';el.appendChild(s)}
}

/* loop */
var last=0,VIG=null;
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S.stopped||S.tip)dt=0;
  if(cur&&S.state==='play'){
    cur.update(dt);
    if(cur.status==='win')onWin();else if(cur.status==='lose')onLose();
    if(cur.timeMax){var f=clamp(cur.time/cur.timeMax,0,1),tf=$('tfill');tf.style.width=(f*100)+'%';tf.style.background=f>.5?'#2fd07a':f>.25?'#ffc933':'#ff4057';tf.style.color=tf.style.background}
  }else if(cur&&(S.state==='won'||S.state==='lost')){
    if(cur.type==='rope')cur.update(dt);
    S.wait-=dt;
    if(S.wait<=0){
      if(S.state==='won'){S.idx++;if(S.idx>=ORDER.length){S.idx=0;S.round++}startLevel()}
      else afterLose();
    }
  }
  fxStep(dt);
  ctx.setTransform(K,0,0,K,0,0);
  if(!VIG){VIG=ctx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.8);VIG.addColorStop(0,'rgba(0,0,10,0)');VIG.addColorStop(1,'rgba(0,0,10,.42)')}
  ctx.save();
  var ie=1;
  if(cur){ie=clamp(cur.t/.5,0,1);ie=1-Math.pow(1-ie,3);var zs=1+.06*(1-ie);ctx.translate(W/2,H/2);ctx.scale(zs,zs);ctx.translate(-W/2,-H/2)}
  if(cur&&cur.shake>0){cur.shake-=dt;ctx.translate(rnd(-4,4),rnd(-4,4))}
  if(cur)cur.draw();else{ctx.fillStyle='#13203f';ctx.fillRect(0,0,W,H)}
  fxDraw();
  if(cur&&ie<1){ctx.fillStyle='rgba(6,10,24,'+(1-ie)+')';ctx.fillRect(-20,-20,W+40,H+40)}
  ctx.restore();
  ctx.fillStyle=VIG;ctx.fillRect(0,0,W,H);
  if(S.state==='won'){
    ctx.fillStyle='rgba(10,16,36,.5)';ctx.fillRect(0,0,W,H);
    var k=clamp((1.1-S.wait)/.3,0,1),sc=.4+.6*k+Math.sin(k*3.14)*.25;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.rotate(Math.sin(k*3.14)*-.06);txt('NICE!',0,0,60,'#ffc933','#17254a');ctx.restore();
  }else if(S.state==='lost'){
    ctx.fillStyle='rgba(60,0,10,.45)';ctx.fillRect(0,0,W,H);
    var jx=Math.sin(ts/25)*3*clamp(S.wait,0,1);
    txt(cur.msg,W/2+jx,H/2,28,'#fff','#c1121f');
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);
fit();hud();
cur=PlugGame(diff());
startScreen();
requestAnimationFrame(frame);
window.__dbg={S:S,get cur(){return cur},MAKERS:MAKERS,ORDER:ORDER,startLevel:startLevel,diff:diff,openTip:openTip};
})();
</script>
